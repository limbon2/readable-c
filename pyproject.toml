# Development environment of the readable-c skill. The skill itself declares
# its dependencies in skills/readable-c/scripts/readable_c.py (PEP 723), so an
# installed skill needs nothing from this file.

[project]
name = "readable-c"
version = "0.4.0"
description = "Development environment for the readable-c agent skill"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[dependency-groups]
# The first three repeat the pins of the skill's PEP 723 header.
dev = [
  "clang-format==23.1.5",
  "pytest>=8.3",
  "ruff>=0.8",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-c==0.24.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["skills/readable-c/scripts"]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["evals/workspaces"]

[tool.ruff.lint]
# The stand-in for Mannie's ESLint set: simplifications, no else after return,
# size and complexity limits, naming, likely bugs, and no commented-out code.
select = [
  "B",
  "C4",
  "C90",
  "E",
  "ERA",
  "F",
  "I",
  "N",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
# Clippy's default; more than five must be passed by keyword.
max-args = 7
max-positional-args = 5

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100 columns. Messages may run to 120, because a
# message split across lines is hard to find with a search.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expected values, hold C sources as long strings,
# and use Cyrillic text to check legacy encodings.
"tests/**" = ["E501", "PLR2004", "RUF001"]
